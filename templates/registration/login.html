{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>販売管理 ログイン</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="error">ユーザー名またはパスワードが違います。</p>{% endif %}
    <label>ユーザー名 {{ form.username }}</label>
    <label>パスワード {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn primary">ログイン</button>
  </form>
</div>
{% endblock %}
