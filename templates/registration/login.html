{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="card login-card">
  <div class="brand"><span class="brand-mark">販</span>販売管理</div>
  <p class="sub">ユーザー名とパスワードを入力してください</p>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="error">ユーザー名またはパスワードが違います。</p>{% endif %}
    <div class="field"><label for="id_username">ユーザー名</label>{{ form.username }}</div>
    <div class="field" style="margin-top: 14px"><label for="id_password">パスワード</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn primary" style="margin-top: 20px">ログイン</button>
  </form>
</div>
{% endblock %}
